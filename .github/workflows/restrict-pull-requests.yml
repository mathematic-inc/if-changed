name: Restrict pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-outside-pull-request:
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      !contains(fromJSON('["renovate[bot]", "dependabot[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Explain policy and close pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMMENT: >-
            Thanks for the proposal. This repository accepts pull requests only from
            organization members, repository collaborators, and approved maintenance bots.
            Please start a Discussion at
            https://github.com/${{ github.repository }}/discussions/new and wait for review.
            If we accept the proposal, a Mathematic maintainer or agent will open the pull request.
        run: gh pr close "$PR_URL" --comment "$COMMENT"
